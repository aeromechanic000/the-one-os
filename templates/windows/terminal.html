<template id="tpl-terminal">
  <div class="term-wrap">
    <div class="term-screen"></div>
    <div class="term-statusbar">
      <span class="term-state">…</span>
      <span class="term-latency"></span>
      <span class="term-attention" hidden></span>
      <span class="term-spacer"></span>
      <button class="btn btn-sm term-actions"></button>
      <button class="btn btn-sm term-files"></button>
      <button class="btn btn-sm term-reconnect" hidden>{{ t('reconnect') }}</button>
    </div>
    <div class="vk-toolbar"></div>
  </div>
</template>
